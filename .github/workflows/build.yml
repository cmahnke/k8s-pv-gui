name: build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Lint, typecheck & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Icon converter
        run: go install github.com/jackmordaunt/icns/cmd/icnsify@latest

      - name: Create icon
        run: |
          convert -size 1024x1024 xc:none -draw "roundrectangle 0,0,1023,1023,256,256" assets/mask.png
          convert assets/icon.png -resize 824x824 -background white -gravity center -extent 1024x1024 assets/logo.png
          convert assets/logo.png -matte assets/mask.png -compose DstIn -composite assets/logo-rounded.png
          convert assets/logo-rounded.png -resize 824x824 -background transparent -gravity center -extent 1024x1024 assets/logo-rounded-mac.png
          $(go env GOPATH | awk '{print $1 "/bin"}')/icnsify  -i assets/logo-rounded.png -o assets/icon.icns

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Stylelint
        run: npm run stylelint

  build:
    name: Build (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            artifact: K8s-Volume-Explorer-mac
            script: dist:mac
            paths: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            artifact: K8s-Volume-Explorer-win
            script: dist:win
            paths: |
              release/*.exe
          - os: ubuntu-latest
            artifact: K8s-Volume-Explorer-linux
            script: dist:linux
            paths: |
              release/*.AppImage
              release/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            %LOCALAPPDATA%\electron\Cache
            %LOCALAPPDATA%\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build & package
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
